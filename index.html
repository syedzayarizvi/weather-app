<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

 <main class="weather-app">

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >

            <button id="searchBtn">Search</button>
        </div>

        <section class="weather-card">

            <h1 id="cityName">Search for a city</h1>
            <p id="dateTime">Today</p>

            <div class="weather-icon" id="weatherIcon">
                🌤️
            </div>

            <h2 id="temperature">--°C</h2>

            <p id="condition">Weather condition</p>

            <div class="weather-details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind</p>
                    <strong id="wind">-- km/h</strong>
                </div>

                <div class="detail">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">--°C</strong>
                </div>

            </div>

            <p id="errorMessage"></p>

        </section>

        <footer>
            <p>Built with ❤️ using HTML, CSS & JavaScript</p>
        </footer>

    </main>

    <script src="script.js"></script>

    
</body>
</html>
